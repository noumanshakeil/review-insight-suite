<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>{{ title }}</title><link rel="stylesheet" href="/static/styles.css"/></head><body><main>
<h1>{{ title }}</h1><p class="sub">Ingest reviews, tag themes/sentiment, generate insight narrative.</p>
<div class="grid"><section class="card">
<form method="post" action="/ui/reviews"><label>Product</label><input name="product" value="{{ product }}"/>
<label>Rating</label><input name="rating" type="number" step="0.5" min="1" max="5" value="4"/>
<label>Review</label><textarea name="text" rows="5" required></textarea><button type="submit">Add</button></form>
</section><section class="card">
<h2>Insights</h2><pre>{{ insights }}</pre>
<h3>Reviews</h3>{% for r in reviews %}<div><span class="pill">{{ r.theme }}</span> <span class="pill">{{ r.sentiment }}</span> {{ r.text }}</div>{% endfor %}
</section></div></main></body></html>
